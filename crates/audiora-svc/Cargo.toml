[package]
name = "audiora-svc"
description = "Audiora engine service: live audio graph and local control API"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "audiora-svc"
path = "src/main.rs"

[dependencies]
arrayvec = "0.7.8"
audiora-core = { path = "../audiora-core" }
audiora-device = { version = "0.1.0", path = "../audiora-device" }
audiora-dsp = { path = "../audiora-dsp" }
audiora-hal = { path = "../audiora-hal" }
audiora-rec = { path = "../audiora-rec" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ctrlc = "3.5.2"
serde_json = "1.0.154"
tungstenite = "0.30.0"

[dev-dependencies]
hound = "3.5"
